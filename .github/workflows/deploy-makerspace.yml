name: Deploy Makerspace API (Shared Hosting VOCHOST)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-makerspace-api-shared-hosting"
  cancel-in-progress: false

jobs:
  build:
    name: Build Node.js API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Install deps
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      # Build Fastify app (TypeScript -> JavaScript)
      - name: Build API
        run: ${{ steps.detect-package-manager.outputs.manager }} run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: makerspace-api-build
          include-hidden-files: true
          path: |
            dist
            public
            package.json
            package-lock.json
          retention-days: 1

  deploy:
    name: Deploy to cPanel Shared Hosting
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: makerspace-api-build
          path: ./

      - name: Pack build artifact
        run: |
          tar -czf deploy.tar.gz \
            dist \
            public \
            package.json \
            package-lock.json

      - name: Upload package via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy.tar.gz"
          # Ensure MAKER_API_APP_PATH points to: /home/iscmapi/server/makerspace
          target: ${{ secrets.MAKER_API_APP_PATH }}

      - name: Extract package, install dependencies and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            source ${{ secrets.NODE_PATH }}
            cd ${{ secrets.MAKER_API_APP_PATH }}

            # Remove old build files
            rm -rf dist public
            rm -f package.json package-lock.json

            # Extract new build
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            # Install production dependencies
            npm ci --omit=dev

            # Restart application via Phusion Passenger (cPanel)
            echo "Restarting Makerspace API Node.js application..."
            mkdir -p tmp
            touch tmp/restart.txt
