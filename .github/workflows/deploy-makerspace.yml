name: Deploy Makerspace API (Shared Hosting VOCHOST)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-makerspace-api-shared-hosting"
  cancel-in-progress: false

jobs:
  build:
    name: Build Node.js API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Install deps
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      # Build Fastify app (TypeScript -> JavaScript)
      - name: Build API
        run: ${{ steps.detect-package-manager.outputs.manager }} run build

      # Đóng gói trực tiếp thành file deploy.zip
      - name: Create Zip Package
        run: |
          zip -r deploy.zip dist public package.json package-lock.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: makerspace-api-zip
          path: deploy.zip
          retention-days: 1

  deploy:
    name: Deploy to cPanel via FTP & Webhook
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: makerspace-api-zip
          path: ./

      # Upload duy nhất file deploy.zip qua FTP
      - name: Sync Zip via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.MAKER_API_APP_PATH }}/ # Ví dụ: /public_html/api/ hoặc thư mục chứa API
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/*
            !deploy.zip

      # Gọi Webhook giải nén và restart Node.js server
      - name: Trigger Remote Unzip Webhook
        run: |
          curl -s "https://iscm-api.ueh.edu.vn/unzip.php?key=makerspace2026"